name: Scrape & deploy

on:
  schedule:
    # hourly, at :07 past the hour (offset to avoid the top-of-hour stampede)
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# Commit refreshed data back to the repo + file a tracking issue on failure.
# The Hosting deploy authenticates via the FIREBASE_SERVICE_ACCOUNT_* secret
# (GOOGLE_APPLICATION_CREDENTIALS), not via these workflow permissions.
permissions:
  contents: write
  issues: write

concurrency:
  group: firebase-live
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---- v2 (Vite + React + TS + Tailwind + SSG) toolchain smoke test ----
      # The v2 scaffold lives at the repo root alongside the Python scraper. We
      # build it in CI to catch toolchain regressions, but the deploy below still
      # ships site/ — the v1 vanilla HTML. The cutover to dist/ happens in a later
      # PR once the React port is feature-complete.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Build v2 (smoke test, not deployed yet)
        run: npm run build

      # Playwright (+ Chromium) renders the per-session social-preview cards. The
      # browser binary is cached; if any of this fails the build still succeeds —
      # build_site.py falls back to the generic og.png per session and surfaces a
      # ::warning:: + step-summary note so the degradation isn't silent. Playwright
      # is pinned exactly and the version is baked into the cache key so a future
      # bump cleanly invalidates the cached Chromium.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.49.1
      # timeout-minutes is essential here: continue-on-error only rescues a step
      # that FAILS, not one that HANGS. Chromium's download has stalled runners for
      # 10+ min, blocking the whole deploy. OG rendering is best-effort (generic
      # og.png fallback), so cap this and move on — a stale preview image must never
      # hold up publishing fresh schedule data.
      - name: Install Playwright + Chromium
        continue-on-error: true
        timeout-minutes: 4
        run: |
          python -m pip install --quiet "playwright==1.49.1"
          python -m playwright install --with-deps chromium

      - name: Scrape all sources → data + per-session pages + preview images
        timeout-minutes: 12
        run: python3 scraper/build_site.py
        env:
          # Interim production base URL = the live Firebase host. Flip this single
          # value to https://openplayri.com once the custom domain is verified.
          SITE_BASE_URL: https://openplayri.com

      # Guard: the built data MUST be valid before anything is published. The build
      # writes sessions.json fresh, but a future bug (or a stray git op) must never
      # be able to ship a truncated / conflict-marked file to prod. Fail the run if
      # the JSON won't parse or still carries merge-conflict markers.
      - name: Validate built data (deploy guard)
        run: |
          python3 -c "import json; json.load(open('site/data/sessions.json'))"
          if grep -nE '^(<<<<<<<|=======|>>>>>>>)' site/data/sessions.json; then
            echo "::error::sessions.json contains merge-conflict markers — refusing to deploy"; exit 1
          fi
          echo "sessions.json is valid JSON with no conflict markers."

      # Guard 2: the data must also be HEALTHY, not just parseable. A failing or
      # zero-session source only produces a ::warning:: in build_merged_document,
      # so without this check a mostly-dark scrape deploys silently (seen
      # 2026-06-26: sources dropped while the build stayed green). One dark
      # source = warn; two+ dark or a collapsed session count = keep yesterday's
      # deploy live instead.
      - name: Validate source health (deploy guard)
        run: python3 scraper/check_source_health.py

      # Publish site/ to Firebase Hosting (live channel) BEFORE the git commit-back,
      # so the deploy always ships the freshly-built working tree and can never be
      # corrupted by a rebase conflict in the commit-back step. Auth via the deploy
      # service-account JSON stored in the repo secret; the key file is written to
      # the runner temp dir and removed after. firebase-tools picks it up through
      # GOOGLE_APPLICATION_CREDENTIALS.
      - name: Deploy to Firebase Hosting (live)
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_OPEN_PLAY_RI }}
        run: |
          echo "$FIREBASE_SA" > "$RUNNER_TEMP/fbsa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/fbsa.json"
          npx --yes firebase-tools@15 deploy --only hosting --project open-play-ri --non-interactive
          rm -f "$RUNNER_TEMP/fbsa.json"

      # Best-effort: keep a record of the schedule in git history. Runs AFTER the
      # deploy, so a rebase race can never affect what's already live. On any
      # conflict we abort cleanly (never leaving markers behind) and let the next
      # cycle commit the data.
      - name: Commit refreshed data (best-effort)
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain site/data/sessions.json site/data/lastmod.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/sessions.json site/data/lastmod.json
            git commit -m "data: refresh pickleball schedule ($(date -u +'%Y-%m-%d %H:%MZ'))"
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}"; then
              git push || echo "::warning::data commit-back lost a push race; will refresh next cycle"
            else
              git rebase --abort 2>/dev/null || true
              echo "::warning::data commit-back hit a rebase conflict; skipped (already deployed; next cycle commits)"
            fi
          else
            echo "No data change."
          fi

      # If anything in the build job failed, open-or-update a single tracking issue
      # so a recurring failure isn't invisible. Idempotent: comments on an existing
      # open issue with the matching title rather than spamming new ones.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          TITLE="CI: scrape-and-deploy is failing"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BODY=$(printf '%s\n\n- Run: %s\n- Trigger: `%s`\n- Commit: `%s`\n- Time: %s\n\nThis issue is auto-updated on each failure; close it once the workflow is green again.' \
            "The hourly **scrape-and-deploy** workflow failed." \
            "$RUN_URL" "$EVENT" "$SHA" "$NOW")
          existing="$(gh issue list --state open --limit 100 \
            --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)"
          if [ -n "$existing" ]; then
            echo "Updating existing tracking issue #$existing"
            gh issue comment "$existing" --body "$BODY"
          else
            echo "Opening new tracking issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi
