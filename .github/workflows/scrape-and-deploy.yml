name: Scrape & deploy

on:
  schedule:
    # hourly, at :07 past the hour (offset to avoid the top-of-hour stampede)
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to commit refreshed data, publish Pages, and file a
# tracking issue when the run fails so a multi-day outage isn't invisible.
permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # ---- v2 (Vite + React + TS + Tailwind + SSG) toolchain smoke test ----
      # The v2 scaffold lives at the repo root alongside the Python scraper.
      # We build it in CI to catch toolchain regressions, but the Pages
      # artifact below still ships site/ — the v1 vanilla HTML. The cutover
      # to dist/ happens in a later PR once the React port is feature-complete.
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install JS deps
        run: npm ci
      - name: Build v2 (smoke test, not deployed yet)
        run: npm run build

      # Playwright (+ Chromium) is used to render the per-session social-preview
      # cards. The browser binary is cached; if any of this fails the build still
      # succeeds — build_site.py falls back to the generic og.png per session
      # and surfaces a ::warning:: + step-summary note so the degradation isn't
      # silent. Playwright is pinned exactly and the version is baked into the
      # cache key so a future bump cleanly invalidates the cached Chromium.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-1.49.1
      - name: Install Playwright + Chromium
        continue-on-error: true
        run: |
          python -m pip install --quiet "playwright==1.49.1"
          python -m playwright install --with-deps chromium

      - name: Scrape the JCC store → data + per-session pages + preview images
        run: python3 scraper/build_site.py
        env:
          SITE_BASE_URL: https://robertcorey.github.io/jcc-pickleball

      # Best-effort: keep a record of the schedule in git history. Never blocks the
      # deploy — the Pages artifact is uploaded from the working tree either way,
      # and a push that loses a race just gets picked up next cycle.
      - name: Commit refreshed data (best-effort)
        continue-on-error: true
        run: |
          if [[ -n "$(git status --porcelain site/data/sessions.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/sessions.json
            git commit -m "data: refresh pickleball schedule ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
            git push || echo "::warning::data commit-back lost a push race; will refresh next cycle"
          else
            echo "No data change."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # If anything in the build job failed, open-or-update a single tracking
      # issue so a recurring failure isn't invisible. Idempotent: comments on an
      # existing open issue with the matching title rather than spamming new ones.
      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          TITLE="CI: scrape-and-deploy is failing"
          NOW="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          BODY=$(printf '%s\n\n- Run: %s\n- Trigger: `%s`\n- Commit: `%s`\n- Time: %s\n\nThis issue is auto-updated on each failure; close it once the workflow is green again.' \
            "The hourly **scrape-and-deploy** workflow failed." \
            "$RUN_URL" "$EVENT" "$SHA" "$NOW")
          # find an existing open issue with the exact title (jq filter, not search relevance)
          existing="$(gh issue list --state open --limit 100 \
            --json number,title --jq ".[] | select(.title==\"$TITLE\") | .number" | head -n1)"
          if [ -n "$existing" ]; then
            echo "Updating existing tracking issue #$existing"
            gh issue comment "$existing" --body "$BODY"
          else
            echo "Opening new tracking issue"
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
