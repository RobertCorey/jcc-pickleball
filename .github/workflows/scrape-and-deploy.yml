name: Scrape & deploy

on:
  schedule:
    # hourly, at :07 past the hour (offset to avoid the top-of-hour stampede)
    - cron: "7 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

# allow the workflow to commit refreshed data and publish Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Playwright (+ Chromium) is used to render the per-session social-preview
      # cards. The browser binary is cached; if any of this fails the build still
      # succeeds — build_site.py falls back to the generic og.png per session.
      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1
      - name: Install Playwright + Chromium
        continue-on-error: true
        run: |
          python -m pip install --quiet "playwright==1.49.*"
          python -m playwright install --with-deps chromium

      - name: Scrape the JCC store → data + per-session pages + preview images
        run: python3 scraper/build_site.py
        env:
          SITE_BASE_URL: https://robertcorey.github.io/jcc-pickleball

      - name: Commit refreshed data (if changed)
        run: |
          if [[ -n "$(git status --porcelain site/data/sessions.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data/sessions.json
            git commit -m "data: refresh pickleball schedule ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git push
          else
            echo "No data change."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
